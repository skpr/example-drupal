version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 1
    groups:
      composer-deps:
        patterns:
          - "*"
        update-types: [ "minor", "patch" ]
      composer-major-deps:
        patterns:
          - "*"
        update-types: [ "major" ]
      composer-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
